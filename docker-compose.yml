services:
  wni-simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wni-simulator
    restart: unless-stopped
    ports:
      - "2567:2567"
    environment:
      - PORT=2567
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=1200
      - COLYSEUS_SEAT_RESERVATION_TIME=120
    deploy:
      resources:
        limits:
          memory: 1500M
