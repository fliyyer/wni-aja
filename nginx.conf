# Konfigurasi Nginx untuk WNI Simulator di VPS (2 vCPU / 2 GB RAM)
# Simpan file ini di /etc/nginx/sites-available/wni-simulator
# lalu symlink ke /etc/nginx/sites-enabled/wni-simulator

upstream wni_backend {
    server 127.0.0.1:2567;
    keepalive 32;
}

server {
    listen 80;
    server_name 43.133.149.19 game.domainanda.com; # Ganti/tambahkan domain Anda jika ada

    # Kompresi gzip untuk mempercepat load aset frontend
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # Optimalisasi TCP untuk latency rendah (anti-delay game)
    tcp_nodelay on;
    tcp_nopush on;

    # Reverse proxy ke Colyseus WebSocket & Express
    location / {
        proxy_pass http://wni_backend;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matikan proxy buffering agar pesan game langsung dikirim tanpa delay / antrean Nginx
        proxy_buffering off;
        proxy_cache off;

        # Timeout koneksi tahan lama (mencegah WebSocket drop)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # Cache agresif file media berat (3D models, audio, font, gambar)
    location ~* \.(?:ico|gif|jpe?g|png|woff2?|eot|ttf|svg|mp3|wav|ogg|glb|gltf|bin)$ {
        proxy_pass http://wni_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # JS dan CSS bundle: wajib revalidate agar browser selalu memakai versi bundle terbaru yang sinkron
    location ~* \.(?:css|js)$ {
        proxy_pass http://wni_backend;
        proxy_set_header Host $host;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }
}
