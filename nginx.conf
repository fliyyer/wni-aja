# Konfigurasi Nginx untuk WNI Simulator di VPS
# Simpan file ini di /etc/nginx/sites-available/wni-simulator
# lalu symlink ke /etc/nginx/sites-enabled/wni-simulator

server {
    listen 80;
    server_name game.domainanda.com; # Ganti dengan domain/IP VPS Anda

    # Reverse proxy ke container/service Node.js Colyseus pada port 2567
    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;

        # WebSocket support headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Cache file statis (audio, fonts, js, css, images) untuk menghemat bandwidth
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp3|wav|ogg)$ {
        proxy_pass http://127.0.0.1:2567;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
