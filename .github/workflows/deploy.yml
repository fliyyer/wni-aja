name: Deploy to Server (CI/CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Verification
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Backend Syntax
        run: |
          cd backend
          npm install --omit=dev
          node -c src/index.js
          node -c src/engine.js
          node -c src/rooms/GameRoom.js

      - name: Deploy via SSH to VPS
        if: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="~/wni-aja"
            fi
            echo "Deploying in $TARGET_DIR..."

            # Clone if directory doesn't exist yet, otherwise pull
            if [ ! -d "$TARGET_DIR" ]; then
              git clone git@github.com:fliyyer/wni-aja.git "$TARGET_DIR" || git clone https://github.com/fliyyer/wni-aja.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            git fetch origin main
            git reset --hard origin/main

            # Auto-detect Docker Compose vs PM2
            if command -v docker &> /dev/null && [ -f "docker-compose.yml" ]; then
              echo "Deploying via Docker Compose (Fresh Build)..."
              docker compose down --remove-orphans || true
              docker compose build --no-cache
              docker compose up -d --force-recreate
            elif command -v pm2 &> /dev/null; then
              echo "Deploying via PM2..."
              cd backend
              npm install --omit=dev
              pm2 restart wni-simulator --update-env || pm2 start src/index.js --name "wni-simulator"
              pm2 save
            else
              echo "Starting with npm start..."
              cd backend
              npm install --omit=dev
              nohup npm start > server.log 2>&1 &
            fi

            echo "Deployment finished successfully!"
